<!doctype html>
<meta charset="utf-8">
<title>지표 일치 검사</title>
<pre id="out">실행 중…</pre>
<script src="../site/js/indicators.js"></script>
<script>
// tools/fixture.json (Python 계산값) 과 JS 계산값을 비교 — dev_relay 로 띄운 뒤 /tools/test_indicators.html 로 열기
(async () => {
  const out = [];
  let fails = 0;
  const close = (a, b) => (a == null && b == null) || (a != null && b != null && Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b)));
  try {
    const cases = await (await fetch('fixture.json')).json();
    for (const c of cases) {
      const ind = Ind.series(c.candles);
      const a = Ind.analyze(c.candles, ind);
      const e = c.expect, bad = [];
      if (JSON.stringify(a.signals) !== JSON.stringify(e.signals)) bad.push(`signals ${a.signals} ≠ ${e.signals}`);
      if (JSON.stringify(a.opinion) !== JSON.stringify(e.opinion)) bad.push(`opinion ${JSON.stringify(a.opinion)} ≠ ${JSON.stringify(e.opinion)}`);
      for (const k of ['rsi', 'macd', 'volRatio']) if (!close(a[k], e[k])) bad.push(`${k} ${a[k]} ≠ ${e[k]}`);
      for (const n of ['5', '20', '60', '120']) if (!close(a.ma[n], e.ma[n])) bad.push(`ma${n} ${a.ma[n]} ≠ ${e.ma[n]}`);
      for (const [k, arr] of Object.entries(e.series)) {
        const js = ind[k].slice(-60);
        const i = arr.findIndex((v, j) => !close(v, js[j]));
        if (i >= 0) bad.push(`series ${k}[${i}] ${js[i]} ≠ ${arr[i]}`);
      }
      if (bad.length) fails++;
      out.push(`${bad.length ? 'FAIL' : 'OK  '} ${c.sym.padEnd(16)} ${a.signals.join(',') || '-'} | ${a.opinion.label}${bad.length ? '\n     ' + bad.join('\n     ') : ''}`);
      out.push(`     notes: ${a.notes.map((n) => n[1]).join(' / ')}`);
    }
    out.unshift(fails ? `RESULT: ${fails} FAIL` : `RESULT: ALL ${cases.length} OK`);
  } catch (e) {
    out.unshift('RESULT: ERROR ' + e.stack);
  }
  document.getElementById('out').textContent = out.join('\n');
})();
</script>
