<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마켓렌즈</title>
    <meta name="description" content="코인·주식 실시간 시세와 기술적 분석, 호가, 스크리너, 포트폴리오" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      // 첫 화면 깜빡임 없이 저장된 테마를 먼저 적용
      try { var t = JSON.parse(localStorage.getItem('ml.theme') || '"auto"'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics (방문자 통계, 쿠키 없음) --><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "1d74f4636b29428490f06a2922302160"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
