name: 데이터 수집 · 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *" # 10분마다 (GitHub 사정에 따라 몇 분씩 밀릴 수 있음)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 예측 엔진(하루 1번, 최대 25분)·펌핑·비트코인 학습이 겹치는 실행도 있어 넉넉히
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: collector/requirements-ai.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 어떤 시장 수집이 실패해도 직전 데이터를 그대로 내보내도록 이전 결과를 먼저 깔아 둔다
      # (종목별 일봉 파일은 매번 새로 만들고 크기가 커서 캐시에서 뺀다)
      - name: 이전 데이터 불러오기
        uses: actions/cache/restore@v6
        with:
          path: |
            web/public/data
            !web/public/data/candles
          key: data-${{ github.run_id }}
          restore-keys: data-

      # 예측 문장(collector/ai.py → claude_ai.py)이 쓰는 공식 Anthropic SDK. 실패해도 수집은 계속되고 Gemma(무료)로 쓴다
      - name: AI 문장용 SDK 설치 (클로드)
        continue-on-error: true
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check --no-input -r collector/requirements-ai.txt

      # 뉴스 호재·악재 판단 · 종목 해설은 Cloudflare Workers AI(Gemma, 무료)를 직접 부른다 (중계 Worker 와 무관).
      # CF Secret 두 개가 없으면 그 단계만 건너뛴다.
      # ANTHROPIC_API_KEY(사용자 Console 키)는 예측 문장(ai.write)만 쓴다 — 이 사이트 몫 누적 150달러·하루 3달러까지,
      # 없거나 한도에 닿으면 Gemma 로 (장부: web/public/data/claude_usage.json, 설정 화면에 표시)
      - name: 스크리너·뉴스·시세 목록 수집
        run: python collector/collect.py
        env:
          PYTHONIOENCODING: utf-8
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # ── 예측 엔진 (collector/model) ───────────────────────────────
      # 10분마다 '돌릴 시장이 있나'만 본다(표준 라이브러리, 1초 미만). 새 일봉이 나온 시장만 하루 1번:
      # 코인 ≈00:15 UTC, 국내 ≈07:45 UTC(평일), 미국 ≈22:15 UTC(평일). 할 일이 없으면 아래는 전부 건너뛴다.
      # 실패해도 배포는 계속되고, 실패한 시장은 직전 결과(데이터 캐시 안 web/public/data/predict)를 유지한다.
      - name: 예측 필요 여부
        id: pcheck
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python collector/model/run.py --if-stale 30 --check >> "$GITHUB_OUTPUT"

      - name: 1시간 예상 필요 여부
        id: hcheck
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python collector/model/hourly.py --check >> "$GITHUB_OUTPUT"

      # 비트코인 카드 모델(collector/btc_forecast.py) 학습이 필요한가 — 하루 1번 (표준 라이브러리, 1초 미만)
      - name: 비트코인 학습 필요 여부
        id: bcheck
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python collector/btc_forecast.py --check-train --if-stale 20 >> "$GITHUB_OUTPUT"

      - name: 예측 엔진 파이썬 (pip 캐시)
        if: (steps.pcheck.outputs.markets != '' || steps.hcheck.outputs.markets != '' || steps.bcheck.outputs.train == '1')
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: collector/requirements-model.txt

      - name: 예측 엔진 의존성 설치
        id: pdeps
        if: (steps.pcheck.outputs.markets != '' || steps.hcheck.outputs.markets != '' || steps.bcheck.outputs.train == '1')
        continue-on-error: true
        timeout-minutes: 6
        run: python -m pip install --disable-pip-version-check --no-input -r collector/requirements-model.txt

      - name: 일봉 이력 불러오기
        if: (steps.pcheck.outputs.markets != '' || steps.hcheck.outputs.markets != '' || steps.bcheck.outputs.train == '1')
        uses: actions/cache/restore@v6
        with:
          path: collector/.history
          key: model-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: model-history-

      - name: 예측 엔진 실행
        id: predict
        if: steps.pcheck.outputs.markets != '' && steps.pdeps.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        env:
          PYTHONIOENCODING: utf-8
        run: python collector/model/run.py --if-stale 30 --deadline 20

      - name: 1시간 예상 (시간봉)
        id: hourly
        if: steps.hcheck.outputs.markets != '' && steps.pdeps.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        env:
          PYTHONIOENCODING: utf-8
        run: python collector/model/hourly.py --markets "${{ steps.hcheck.outputs.markets }}" --deadline 10

      # 코인 예측 엔진이 도는 실행(하루 1번, 길다)과는 겹치지 않게 — 그 실행이면 다음 실행으로 미룬다
      - name: 비트코인 학습 (하루 1번)
        id: btrain
        if: steps.bcheck.outputs.train == '1' && steps.pdeps.outcome == 'success' && steps.pcheck.outputs.markets == ''
        continue-on-error: true
        timeout-minutes: 12
        env:
          PYTHONIOENCODING: utf-8
        run: python collector/btc_forecast.py --train --if-stale 20 --deadline 6

      # ── 펌핑 후보 (collector/pump.py) ─────────────────────────────
      # 학습·검증은 하루 1번(일봉 이력·numpy 가 있는 실행에서만, 20시간 안에 했으면 바로 끝남).
      # 매 실행은 표준 라이브러리로 업비트 시간봉을 조금씩 받아 점수 계산 (collect.py 의 candles·news_state 를 읽는다).
      # 캐시가 비어도 저장소에 넣어 둔 처음용 모델(collector/pump/model.json)로 돈다.
      - name: 펌핑 모델 학습·검증 (하루 1번)
        if: steps.pdeps.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONIOENCODING: utf-8
        run: python collector/pump.py --train --if-stale 20

      - name: 펌핑 후보
        continue-on-error: true
        timeout-minutes: 8
        env:
          PYTHONIOENCODING: utf-8
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collector/pump.py

      # 순위(오늘 강할 코인 · 전체 순위) · 추천 모음 · 채점 기록 — 새 기준일의 이유 문장(AI)은 보통 여기서 처음 쓴다
      - name: 추천 모음 다시 계산
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collector/recommend.py

      - name: 일봉 이력 저장
        if: always() && (steps.pcheck.outputs.markets != '' || steps.hcheck.outputs.markets != '' || steps.bcheck.outputs.train == '1') && (steps.predict.outcome != 'skipped' || steps.hourly.outcome != 'skipped' || steps.btrain.outcome != 'skipped')
        uses: actions/cache/save@v6
        with:
          path: collector/.history
          key: model-history-${{ github.run_id }}-${{ github.run_attempt }}

      # 전략 탭(분출 임박·돌파…)이 과거에 실제로 통했는지 — 하루 1번 (예측 엔진과 같은 numpy·pandas·scipy 필요, 없으면 설치)
      - name: 전략 탭 백데이터 검증
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 20시간 안에 검증했으면 numpy 없이 바로 끝난다. 할 차례인데 numpy 가 없으면 설치하고 다시
          if python collector/setups.py --stats --if-stale 20; then exit 0; fi
          python -m pip install --disable-pip-version-check --no-input -r collector/requirements-model.txt
          python collector/setups.py --stats --if-stale 20

      # 비트코인 카드 — 24시간 예상·범위·갈림길·결론 문장·채점 (표준 라이브러리 + ai.py, 업비트 요청 1번). 1시간 예측은 브라우저가 계산
      - name: 비트코인 카드
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONIOENCODING: utf-8
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collector/btc_forecast.py

      - name: 데이터 저장
        uses: actions/cache/save@v6
        with:
          path: |
            web/public/data
            !web/public/data/candles
          key: data-${{ github.run_id }}

      - name: 사이트 빌드 (React)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          cp ../worker/worker.js dist/worker.js
          # 수집기 내부 상태 파일은 사이트에 올리지 않는다 (공개 정보뿐이지만 사이트가 읽지 않음)
          rm -f dist/data/coin_social.json dist/data/news_hist.json
          rm -f dist/data/pump_bars.json dist/data/pump_state.json dist/data/pump_model.json
          rm -f dist/data/btc_model.json dist/data/btc_bars.json

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
